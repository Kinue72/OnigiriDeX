# Builds and publishes a release for every pushed tag: the checks in check.yml first, then the
# AP on GitHub's runners and scripts/release.sh (the AP, an OTA from the previous release and
# version.txt). Setup (firmware draft release, signing key secret) is in docs/releasing.md.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      ONIGIRI_REPO: ${{ github.repository }}
    steps:
      # Everything a release needs, checked before hours of building.
      - name: Preflight
        env:
          KEYS: ${{ secrets.ONIGIRI_SIGNING_KEYS }}
        run: |
          [ -n "$KEYS" ] || { echo "::error::Set the ONIGIRI_SIGNING_KEYS secret (docs/releasing.md)."; exit 1; }
          PARTS="$(gh release view firmware --repo "$ONIGIRI_REPO" --json assets --jq '[.assets[] | select(.name | startswith("onigiri-fw.tar.zst."))] | length')" || PARTS=0
          [ "$PARTS" -gt 0 ] || { echo "::error::The firmware draft release is missing (docs/releasing.md)."; exit 1; }
          if gh release view "$GITHUB_REF_NAME" --repo "$ONIGIRI_REPO" --json isDraft --jq 'select(.isDraft | not)' | grep -q .; then
            echo "::error::Release $GITHUB_REF_NAME already exists."
            exit 1
          fi

      # The build needs ~100 GB: the runner's 145 GB disk has ~85 GB free, the SDKs below ~35 more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v7

      # Build in Debian 13 like the build machine (Ubuntu 24.04's libfmt is too old for
      # android-tools), as the runner's user so the host can still clean up.
      - name: Build environment
        run: |
          docker build --progress=plain -t onigiri-build - << 'EOF'
          FROM debian:trixie
          RUN apt-get update && apt-get install -y --no-install-recommends \
            attr bc bison brotli build-essential ca-certificates clang cmake cpio curl \
            device-tree-compiler dwarves e2fsprogs file flex gawk gh git golang-go gperf kmod lld llvm \
            lz4 meson ninja-build openjdk-21-jdk-headless pcre2-utils perl pkg-config protobuf-compiler \
            python3 python3-dev python3-pip python3-venv python3-protobuf python3-pyelftools \
            python3-jinja2 rsync secilc swig unzip wget xxd xz-utils zip zstd libbrotli-dev libdw-dev \
            libelf-dev libfmt-dev libgmock-dev libgtest-dev liblz4-dev libncurses-dev libpcre2-dev \
            libprotobuf-dev libsepol-dev libssl-dev libudev-dev libunwind-dev libusb-1.0-0-dev \
            libzstd-dev && rm -rf /var/lib/apt/lists/*
          RUN useradd -m -u 1001 runner
          # depmod and debugfs live in sbin; Java needs a UTF-8 locale for non-ASCII file names.
          ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8
          EOF
          echo "DEBIAN=docker run --rm --user $(id -u):$(id -g) -e GH_TOKEN -e ONIGIRI_REPO -e GITHUB_REF_NAME \
            -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE -w $GITHUB_WORKSPACE onigiri-build bash -ec" >> "$GITHUB_ENV"

      - name: Signing keys
        env:
          KEYS: ${{ secrets.ONIGIRI_SIGNING_KEYS }}
        run: echo "$KEYS" | base64 -d | tar -xz -C security

      # Samsung's servers won't serve the pinned firmware any more, so it comes pre-extracted from
      # a draft release, which only people with push access can see.
      - name: Firmware
        run: |
          mkdir -p out
          gh release view firmware --json assets --jq '.assets[].name' | sort | while read -r PART; do
            gh release download firmware --pattern "$PART" --output -
          done | zstd -dc | tar -x -C out
          python3 scripts/verify_fw.py SM-F731B/XXV out/fw/SM-F731B_XXV
          python3 scripts/verify_fw.py SM-F946B/XXV out/fw/SM-F946B_XXV

      # The build tools and the kernel only change with their own sources, so they are kept in the
      # private "build-cache" draft release under a hash of those sources and reused by every release.
      # (Actions caches are scoped to one tag, so they wouldn't carry over to the next release.)
      - name: Versions
        id: versions
        run: |
          source ./buildenv.sh SM-F731B > /dev/null
          # The cached boot images are also repacked from the stock ones by these scripts.
          KERNEL="$(cat scripts/build_kernel.sh scripts/package_kernel.sh scripts/utils/source_patches.sh \
            onigiri/configs/firmware.json | sha256sum | cut -c1-12)"
          echo "kernel=kernel-$KERNEL_RELEASE-$KERNEL.tar.zst" >> "$GITHUB_OUTPUT"
          TOOLS="$({ git ls-tree HEAD external/android-tools external/apktool external/erofs-utils \
            external/samloader external/signapk; git ls-files -s scripts/build_dependencies.sh external/make.sh \
            external/patches external/ext4_utils external/f2fs_utils; } | sha256sum | cut -c1-16)"
          echo "tools=tools-$TOOLS.tar.zst" >> "$GITHUB_OUTPUT"
          gh release view build-cache > /dev/null 2>&1 || gh release create build-cache --draft \
            --title "Build cache for CI (never publish)" --notes "Built tools and kernels, reused by release.yml."

      - name: Tools
        env:
          CACHE: ${{ steps.versions.outputs.tools }}
        run: |
          mkdir -p out
          if ! gh release download build-cache --pattern "$CACHE" --output - | zstd -dc | tar -x -C out; then
            git submodule update --init --recursive --depth 1 external/android-tools external/apktool \
              external/erofs-utils external/samloader external/signapk
            $DEBIAN 'source ./buildenv.sh SM-F731B > /dev/null && onigiri build_dependencies'
            tar -C out -cf - tools | zstd -T0 > "$CACHE"
            gh release upload build-cache "$CACHE" --clobber && rm "$CACHE"
          fi

      - name: Kernel
        env:
          CACHE: ${{ steps.versions.outputs.kernel }}
        run: |
          mkdir -p out/target/b5q
          git submodule update --init --depth 1 external/kernel
          if gh release download build-cache --pattern "$CACHE" --output - | zstd -dc | tar -x -C out/target/b5q; then
            # The ROM build still needs the kernel's pinned clang (DeX compositor patch): fetch it
            # the way the kernel build does, with the URL and checksum from its patched build.sh.
            git -C external/kernel apply --include=build.sh "$PWD"/external/patches/kernel/*.patch
            eval "$(grep -E '^export TOOLCHAIN_(URL|SHA256)=' external/kernel/build.sh)"
            git -C external/kernel checkout -- build.sh
            wget -q -O "$RUNNER_TEMP/clang.tar.xz" "$TOOLCHAIN_URL"
            echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/clang.tar.xz" | sha256sum -c -
            tar -xf "$RUNNER_TEMP/clang.tar.xz" -C external/kernel/kernel_platform --strip-components=1 toolchain/prebuilts
            rm "$RUNNER_TEMP/clang.tar.xz"
          else
            $DEBIAN 'source ./buildenv.sh SM-F731B > /dev/null && onigiri build_kernel'
            rm -rf external/kernel/out
            tar -C out/target/b5q -cf - kernel | zstd -T0 > "$CACHE"
            gh release upload build-cache "$CACHE" --clobber && rm "$CACHE"
          fi

      - name: Build ROM
        run: |
          $DEBIAN 'source ./buildenv.sh SM-F731B > /dev/null && onigiri build_odin'
          ls -l out/Onigiri_AP_*

      # Room for the OTA: only the OTA tools are still needed from the firmware.
      - name: Free build space
        run: |
          rm -rf out/target/b5q/work_dir out/target/b5q/apktool
          git submodule deinit --force --quiet external/kernel || true
          find out/fw -mindepth 2 -maxdepth 2 ! -name fota -exec rm -rf {} +
          df -h /

      - name: Publish release
        run: $DEBIAN 'source ./buildenv.sh SM-F731B > /dev/null && onigiri release "$GITHUB_REF_NAME" out/Onigiri_AP_*.tar.md5'
