# Publishes a release for every pushed tag: scripts/release.sh builds the tagged commit, makes an
# OTA from the previous release and uploads both. The build needs Samsung firmware, the signing
# keys and ~250 GB of disk, so it runs on a self-hosted runner labelled "onigiri" (setup in
# docs/releasing.md).
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: [self-hosted, onigiri]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep out/ (firmware, tools, kernel and released APKs) between runs.
          clean: false
          submodules: recursive
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Debian keeps depmod and debugfs in sbin.
          export PATH="$PATH:/usr/sbin:/sbin"
          source ./buildenv.sh SM-F731B > /dev/null
          onigiri release "$GITHUB_REF_NAME"
